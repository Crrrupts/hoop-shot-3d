<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hoop Shot 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
</head>

<body>
    <!-- The WebGL Game -->
    <canvas id="game-canvas" width="800" height="600"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="top-left" class="hud-box">
            <div id="score-display">YOU 0</div>
            <div id="rival-display">RIVAL 0</div>
            <div id="streak-display">Streak x0</div>
            <div id="streak-hint"></div>
            <div id="hype-row">HYPE <div id="hype-bar"><div id="hype-fill"></div></div></div>
        </div>

        <div id="top-center">
            <div id="camera-display">Camera: Shooter (C to switch)</div>
            <div id="court-display"></div>
            <div id="wind-display"></div>
        </div>

        <div id="top-right" class="hud-box">
            <div id="time-display">TIME 3:00</div>
            <div id="spot-display">Spot 3 of 5</div>
        </div>

        <!-- Frame around the small live view of the rival's hoop (drawn by renderer.js) -->
        <div id="rival-view"><span id="rival-view-label">RIVAL</span></div>

        <!-- Active power-ups (green = helping you, red = hurting you) -->
        <div id="effects-list"></div>

        <!-- Big text for streak tiers and overtime -->
        <div id="banner"></div>
        <!-- Small message when the rival picks a card -->
        <div id="toast"></div>
        <!-- Floating text like +2, SWISH!, SO CLOSE! (added by ui.js) -->
        <div id="popups"></div>
        <!-- Whole-screen flash and the glowing border for streak tiers -->
        <div id="flash"></div>
        <div id="glow"></div>

        <div id="power-meter-container">
            <div id="power-label">Power</div>
            <div id="power-bar-bg" role="meter" aria-labelledby="power-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="sweet-zone"></div>
                <div id="power-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Controls below canvas -->
    <div id="controls-bar">
        <label for="difficulty-slider">Difficulty</label>
        <input type="range" id="difficulty-slider" min="1" max="3" value="2" aria-valuetext="Medium">
        <span id="diff-label">Medium</span>

        <button id="start-btn">Start</button>
    </div>

    <!-- Power-up pick: the game pauses and you choose one of two cards -->
    <div id="pick-overlay">
        <h2 id="pick-title">Power-up! Pick one</h2>
        <div id="pick-cards">
            <button class="pick-card" id="pick-buff">
                <span class="pick-side">BUFF FOR YOU</span>
                <span class="pick-rarity"></span>
                <span class="pick-name"></span>
                <span class="pick-text"></span>
                <span class="pick-key">Left arrow or 1</span>
            </button>
            <button class="pick-card" id="pick-sabotage">
                <span class="pick-side">SABOTAGE THE RIVAL</span>
                <span class="pick-rarity"></span>
                <span class="pick-name"></span>
                <span class="pick-text"></span>
                <span class="pick-key">Right arrow or 2</span>
            </button>
        </div>
        <div id="pick-timer"><div id="pick-timer-fill"></div></div>
    </div>

    <!-- Start/Game Over Menu -->
    <div id="menu-overlay">
        <h1 id="menu-title">Hoop Shot 3D</h1>
        <p id="menu-subtitle">Race the rival: most points in 3 minutes wins</p>
        <p id="menu-controls">Mouse: aim | Hold Space: power | A/D: spot | C: camera | R: restart</p>
        <div id="court-picker">
            <label for="court-select">Court</label>
            <select id="court-select"></select>
            <p id="court-blurb"></p>
        </div>
        <button id="play-btn">Play Game</button>
    </div>

    <!-- GLSL shaders (our own). Phong shading: the lighting is worked out for every pixel. -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 vPosition;       // vertex position in the object's own space
        attribute vec3 vNormal;         // which way the surface faces
        attribute vec2 vTexCoord;       // where this vertex is on the texture image

        uniform mat4 uModel;            // object space -> world (translate, rotate, scale)
        uniform mat4 uView;             // world -> camera (from lookAt)
        uniform mat4 uProjection;       // camera -> screen (from perspective)
        uniform mat3 uNormalMatrix;     // rotates normals to match uModel
        uniform float uNormalSign;      // -1 when we are inside a box (arena walls)
        uniform vec2 uTexScale;         // repeats the texture (walls)
        uniform float uPointSize;       // size of dots (snow, confetti) at 1 m away, in pixels

        varying vec3 fPosition;         // world position, passed on to the fragment shader
        varying vec3 fNormal;
        varying vec2 fTexCoord;

        void main() {
            vec4 world = uModel * vPosition;
            fPosition = world.xyz;
            fNormal = uNormalMatrix * vNormal * uNormalSign;
            fTexCoord = vTexCoord * uTexScale;
            gl_Position = uProjection * uView * world;
            gl_PointSize = uPointSize / gl_Position.w;      // dots shrink with distance
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;

        varying vec3 fPosition;
        varying vec3 fNormal;
        varying vec2 fTexCoord;

        uniform vec3 uEye;                  // camera position
        uniform vec3 uAmbientLight;         // light that reaches everything
        uniform vec3 uLightPosition[3];
        uniform vec3 uLightColor[3];
        uniform vec3 uSpotDirection[3];     // which way each spotlight points
        uniform vec2 uSpotCone[3];          // cos(inner angle), cos(outer angle)

        uniform vec3 uColor;                // material color
        uniform vec3 uSpecular;             // highlight color (0 = matte)
        uniform float uShininess;           // bigger = smaller, sharper highlight
        uniform float uAlpha;               // 1 = solid, less = see-through
        uniform bool uLit;                  // false for lines and shadows (flat color)
        uniform bool uUseTexture;
        uniform sampler2D uTexture;
        uniform float uFogDensity;          // 0 = no fog (Fog Machine power-up turns it on)
        uniform vec3 uFogColor;
        uniform int uPointShape;            // 0 = not a dot, 1 = soft round dot, 2 = square dot
        uniform vec3 uTint;                 // colors the whole picture (Inferno streak turns it red-orange)

        // Blend a color toward the fog color the farther it is from the camera
        vec3 addFog(vec3 color) {
            float amount = 1.0 - exp(-uFogDensity * distance(uEye, fPosition));
            return mix(color, uFogColor, amount) * uTint;
        }

        void main() {
            vec3 base = uColor;
            float alpha = uAlpha;
            if (uUseTexture) {
                vec4 texel = texture2D(uTexture, fTexCoord);
                if (texel.a < 0.5) discard;             // cut-out images (crowd fans)
                base *= texel.rgb;
            }
            if (uPointShape == 1) {
                // round dot that fades out toward its edge
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                alpha *= 1.0 - smoothstep(0.2, 0.5, d);
            }

            if (!uLit) {
                gl_FragColor = vec4(addFog(base), alpha);
                return;
            }

            vec3 N = normalize(fNormal);
            vec3 V = normalize(uEye - fPosition);       // toward the camera

            // Phong model: ambient + for each light (diffuse + specular)
            vec3 color = uAmbientLight * base;
            for (int i = 0; i < 3; i++) {
                vec3 L = normalize(uLightPosition[i] - fPosition);     // toward the light
                // spotlight: full strength inside the inner cone, fading to 0 at the outer cone
                float spot = smoothstep(uSpotCone[i].y, uSpotCone[i].x, dot(-L, uSpotDirection[i]));
                float diffuse = max(dot(N, L), 0.0);
                float specular = 0.0;
                if (diffuse > 0.0) {
                    vec3 R = reflect(-L, N);                           // mirror direction of the light
                    specular = pow(max(dot(R, V), 0.0), uShininess);
                }
                color += spot * uLightColor[i] * (diffuse * base + specular * uSpecular);
            }
            gl_FragColor = vec4(addFog(color), alpha);
        }
    </script>

    <!-- Class libraries (Edward Angel): matrix/vector math and shader loading -->
    <script src="Common/MV.js"></script>
    <script src="Common/initShaders.js"></script>

    <!-- Game code -->
    <script src="courts.js"></script>
    <script src="ui.js"></script>
    <script src="input.js"></script>
    <script src="physics.js"></script>
    <script src="powerups.js"></script>
    <script src="game.js"></script>
    <script src="effects.js"></script>
    <script src="crowd.js"></script>
    <script src="camera.js"></script>
    <script src="geometry.js"></script>
    <script src="textures.js"></script>
    <script src="renderer.js"></script>
    <script src="main.js"></script>
</body>

</html>
